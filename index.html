<!DOCTYPE html>
<html>
<head>
  <title>NEXUS AI</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .msg {
      max-width: 70%;
      padding: 10px;
      border-radius: 10px;
      margin: 10px;
    }

    .user {
      background: #238636;
      margin-left: auto;
    }

    .bot {
      background: #30363d;
      margin-right: auto;
    }

    #inputArea {
      display: flex;
      padding: 10px;
      background: #161b22;
    }

    input {
      flex: 1;
      padding: 10px;
      background: #30363d;
      border: none;
      color: white;
    }

    button {
      background: #238636;
      border: none;
      padding: 10px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="chat"></div>

<div id="inputArea">
  <input id="entrada" placeholder="Pergunte ao NEXUS..." />
  <button onclick="responder()">Enviar</button>
</div>

<script>
function addMsg(texto, tipo) {
  let chat = document.getElementById("chat")
  let div = document.createElement("div")
  div.className = "msg " + tipo
  div.innerText = texto
  chat.appendChild(div)
  chat.scrollTop = chat.scrollHeight
}

function responder() {
  let input = document.getElementById("entrada")
  let user = input.value.toLowerCase()

  if (user.trim() === "") return

  addMsg(user, "user")

  let resposta = "Não sei ainda 😅"

  if (user.includes("oi") || user.includes("ola")) {
    resposta = "Salve 😎"
  }
  else if (user.includes("quem é você")) {
    resposta = "Eu sou o NEXUS, criado pelo Amadeu 😏"
  }
  else if (user.includes("tudo bem")) {
    resposta = "Tô suave, e você?"
  }

  addMsg(resposta, "bot")

  input.value = ""
}
  let input = document.getElementById("entrada")
  let user = input.value

  if (user.trim() === "") return

  addMsg(user, "user")

  addMsg("NEXUS ainda não tem IA conectada 😅", "bot")

  input.value = ""
}
</script>

</body>
</html>
