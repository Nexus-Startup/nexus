<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>NEXUS</title>

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      background: rgba(0,0,0,0.6);
      border-bottom: 1px solid #333;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 70%;
      padding: 12px;
      border-radius: 12px;
      animation: fade 0.2s ease;
    }

    .user {
      align-self: flex-end;
      background: #00bcd4;
      color: black;
    }

    .bot {
      align-self: flex-start;
      background: #2c2c2c;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      display: flex;
      padding: 10px;
      border-top: 1px solid #333;
      background: #111;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #222;
      color: white;
    }

    button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #00bcd4;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #00e5ff;
    }
  </style>
</head>

<body>

<header>NEXUS AI</header>

<div id="chat"></div>

<footer>
  <input id="entrada" placeholder="Fala com o NEXUS...">
  <button onclick="responder()">Enviar</button>
</footer>

<script>
let memoria = JSON.parse(localStorage.getItem("nexus_memoria")) || {}

function salvarMemoria() {
  localStorage.setItem("nexus_memoria", JSON.stringify(memoria))
}

function addMsg(texto, classe) {
  let chat = document.getElementById("chat")
  let msg = document.createElement("div")

  msg.className = "msg " + classe
  msg.innerText = texto

  chat.appendChild(msg)
  chat.scrollTop = chat.scrollHeight
}

function responder() {
  let input = document.getElementById("entrada")
  let user = input.value.toLowerCase()

  if (user.trim() === "") return

  addMsg(user, "user")

  let resposta = ""

  // 🔥 MEMÓRIA
  if (memoria[user]) {
    resposta = memoria[user]
  }

  // 🔥 INTELIGÊNCIA BASE
  else if (user.includes("oi") || user.includes("ola")) {
    resposta = "Salve 😎"
  }
  else if (user.includes("quem é você")) {
    resposta = "Eu sou o NEXUS, uma IA em evolução 👁️"
  }
  else if (user.includes("tudo bem")) {
    resposta = "Tô suave. E você?"
  }
  else if (user.includes("seu criador")) {
    resposta = "Fui criado por um gênio 😏"
  }
  else if (user.includes("tempo") || user.includes("hora")) {
    resposta = "Agora são " + new Date().toLocaleTimeString()
  }

  // 🔥 APRENDIZADO
  else {
    resposta = "Não sei ainda 😅 me ensina?"

    setTimeout(() => {
      let ensino = prompt("Como eu deveria responder?")
      if (ensino && ensino.trim() !== "") {
        memoria[user] = ensino
        salvarMemoria()
        addMsg("Aprendi 😎", "bot")
      }
    }, 500)
  }

  // 🔥 RESPOSTA COM DELAY (parece IA real)
  setTimeout(() => {
    addMsg(resposta, "bot")
  }, 300)

  input.value = ""
}
</script>
</body>
</html>
