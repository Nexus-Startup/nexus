<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>NEXUS AI</title>

<style>
body {
  background: #0f0f0f;
  color: white;
  font-family: Arial;
  margin: 0;
}

header {
  text-align: center;
  padding: 15px;
  font-size: 20px;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
}

#chat {
  height: 75vh;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 70%;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.bot {
  background: #333;
}

#inputArea {
  display: flex;
  padding: 10px;
  border-top: 1px solid #333;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: #1a1a1a;
  color: white;
}

button {
  padding: 10px;
  background: #2563eb;
  border: none;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
NEXUS AI 👁️ — Conectando a tecnologia ao seu dia a dia
</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="entrada" placeholder="Pergunte qualquer coisa..." />
  <button onclick="responder()">Enviar</button>
</div>

<script>
let memoria = JSON.parse(localStorage.getItem("nexus_memoria")) || {}
let nomeUsuario = localStorage.getItem("nexus_nome") || null

function salvar() {
  localStorage.setItem("nexus_memoria", JSON.stringify(memoria))
}

function addMsg(texto, classe) {
  let chat = document.getElementById("chat")
  let msg = document.createElement("div")

  msg.className = "msg " + classe
  msg.innerText = texto

  chat.appendChild(msg)
  chat.scrollTop = chat.scrollHeight
}

// 🌐 pesquisa simples
async function pesquisar(pergunta) {
  try {
    let url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(pergunta) + "&format=json"
    let res = await fetch(url)
    let data = await res.json()
    return data.AbstractText || null
  } catch {
    return null
  }
}

// 🧠 cérebro melhorado
function pensar(user) {

  // memória direta
  if (memoria[user]) return memoria[user]

  // nome
  if (user.includes("meu nome é")) {
    nomeUsuario = user.replace("meu nome é", "").trim()
    localStorage.setItem("nexus_nome", nomeUsuario)
    return "Prazer, " + nomeUsuario + " 😎"
  }

  if (user.includes("qual meu nome")) {
    return nomeUsuario ? "Seu nome é " + nomeUsuario : "Você ainda não me disse seu nome 😅"
  }

  // conversa natural
  if (user.includes("oi") || user.includes("ola")) {
    return "E aí " + (nomeUsuario || "") + " 👋"
  }

  if (user.includes("tudo bem")) {
    return "Tô tranquilo 😌 e você?"
  }

  if (user.includes("quem é você")) {
    return "Sou o NEXUS, uma IA em evolução criada por você 👁️"
  }

  if (user.includes("hora")) {
    return "Agora são " + new Date().toLocaleTimeString()
  }

  if (user.includes("data")) {
    return "Hoje é " + new Date().toLocaleDateString()
  }

  if (user.includes("teorema")) {
    return "Seu Teorema NEXUS busca IA eficiente, honesta e com memória infinita. Isso é bem avançado 👀"
  }

  return null
}

async function responder() {
  let input = document.getElementById("entrada")
  let user = input.value.toLowerCase().trim()

  if (!user) return

  addMsg(user, "user")

  let resposta = pensar(user)

  if (resposta) {
    setTimeout(() => addMsg(resposta, "bot"), 300)
  } else {
    addMsg("Pensando... 🧠", "bot")

    let resultado = await pesquisar(user)

    if (resultado) {
      addMsg(resultado, "bot")
    } else {
      addMsg("Não sei ainda 😅 me ensina?", "bot")

      setTimeout(() => {
        let ensino = prompt("O que eu deveria responder?")

        if (ensino && ensino.trim()) {
          memoria[user] = ensino
          salvar()
          addMsg("Aprendi 😎", "bot")
        }
      }, 500)
    }
  }

  input.value = ""
}

document.getElementById("entrada").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    responder()
  }
})

// mensagem inicial
setTimeout(() => {
  addMsg("NEXUS online 👁️ Pronto pra evoluir.", "bot")
}, 500)
</script>

</body>
</html>
